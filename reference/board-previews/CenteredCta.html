<!-- @dsCard group="Patterns" height=520 subtitle="Light centred CTA + inline banner" -->
<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--off-white)}
.pv{display:flex;flex-direction:column;gap:12px;max-width:720px;margin:0 auto}
.pv-c{font-size:12px;color:var(--gray-600);font-family:ui-monospace,Menlo,monospace}
</style></head><body>
<div class="pv">
  <span class="pv-c">.dp-ccta · text-button-center · light</span>
  <section class="dp-ccta" aria-labelledby="pv-partner-h">
    <span class="eyebrow">Become a partner</span>
    <h2 class="h2 dp-ccta-title" id="pv-partner-h">Own a station? Help us reach your <span class="em">city</span>.</h2>
    <div class="dp-ccta-actions">
      <a class="btn btn-primary" href="#">Become a partner</a>
      <a class="btn btn-secondary" href="#">Talk to our team</a>
    </div>
  </section>
  <span class="pv-c" style="margin-top:12px">.card.card-flat.dp-banner · FAQ / Team pages</span>
  <aside class="card card-flat dp-banner" aria-labelledby="pv-ask-h">
    <div class="dp-banner-text">
      <h2 class="h3" id="pv-ask-h">Still have a question?</h2>
      <p class="muted small">Our team replies personally.</p>
    </div>
    <a class="btn btn-primary" href="#">Contact us</a>
  </aside>
</div>
</body></html>
