<!-- @dsCard group="Forms" height=440 subtitle="Field button, caret, listbox" -->
<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--off-white)}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;align-items:start}
.c{display:flex;flex-direction:column;gap:10px}
@media (max-width:767px){.g{grid-template-columns:minmax(0,1fr)} }
</style></head><body>
<div class="g">
  <div class="c">
    <span class="fm-st">Live · click or Enter opens</span>
    <div class="field">
      <span class="label" id="sl-label">Topic</span>
      <div class="fm-sel" id="sl">
        <button type="button" class="input fm-sel-btn" id="sl-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="sl-label sl-btn">
          <span class="fm-ph" id="sl-val">Choose a topic</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="fm-menu fm-menu-float" role="listbox" id="sl-list" aria-labelledby="sl-label" hidden></div>
      </div>
      <p class="hint">Contact form · selected item shows a check</p>
    </div>
  </div>
  <div class="c">
    <span class="fm-st">Closed · filled</span>
    <div class="field">
      <span class="label">Topic</span>
      <div class="fm-sel">
        <button type="button" class="input fm-sel-btn" aria-haspopup="listbox" aria-expanded="false">
          <span>Broadcast partner</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="c">
    <span class="fm-st">Open · static</span>
    <div class="field">
      <span class="label">Topic</span>
      <div class="fm-sel">
        <button type="button" class="input fm-sel-btn" aria-haspopup="listbox" aria-expanded="true">
          <span>Partnership</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="fm-menu fm-menu-static" role="listbox" aria-label="Topic">
          <button type="button" class="fm-opt" role="option" aria-selected="false"><span>General question</span></button>
          <button type="button" class="fm-opt" role="option" aria-selected="true"><span>Partnership</span><svg class="fm-opt-tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button>
          <button type="button" class="fm-opt fm-active" role="option" aria-selected="false"><span>Broadcast partner</span></button>
          <button type="button" class="fm-opt" role="option" aria-selected="false"><span>Publishing or NFC order</span></button>
          <button type="button" class="fm-opt" role="option" aria-selected="false"><span>Prayer request</span></button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var topics=['General question','Partnership','Broadcast partner','Publishing or NFC order','Prayer request'];
  var btn=document.getElementById('sl-btn'),list=document.getElementById('sl-list'),val=document.getElementById('sl-val'),sel='';
  var tick='<svg class="fm-opt-tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
  function render(){
    list.innerHTML='';
    topics.forEach(function(t){
      var b=document.createElement('button');b.type='button';b.className='fm-opt';b.setAttribute('role','option');
      b.setAttribute('aria-selected',t===sel?'true':'false');
      b.innerHTML='<span></span>'+(t===sel?tick:'');b.firstChild.textContent=t;
      b.addEventListener('mousedown',function(e){e.preventDefault();sel=t;val.textContent=t;val.className='';set(false);});
      list.appendChild(b);
    });
  }
  function set(open){btn.setAttribute('aria-expanded',open?'true':'false');list.hidden=!open;if(open)render();}
  btn.addEventListener('click',function(){set(list.hidden);});
  btn.addEventListener('blur',function(){setTimeout(function(){set(false);},150);});
  btn.addEventListener('keydown',function(e){if(e.key==='Escape')set(false);});
})();
</script>
</body></html>
