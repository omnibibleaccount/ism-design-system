<!-- @dsCard group="Forms" height=196 subtitle="Icon left, clear once typed" -->
<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--off-white)}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;align-items:start}
.c{display:flex;flex-direction:column;gap:10px}
@media (max-width:767px){.g{grid-template-columns:minmax(0,1fr)} }
</style></head><body>
<div class="g">
  <div class="c">
    <span class="fm-st">Live · type, then clear</span>
    <form class="field" role="search" id="sf-form">
      <label class="label" for="sf-q">Search</label>
      <div class="fm-sf">
        <svg class="fm-sf-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input class="input" id="sf-q" type="search" placeholder="Search programs, FAQs, pages" autocomplete="off">
        <button type="button" class="fm-sf-clear" id="sf-clear" aria-label="Clear search" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p class="hint">Press Enter to see results.</p>
    </form>
  </div>
  <div class="c">
    <span class="fm-st">Filled · clear button shown</span>
    <div class="field">
      <label class="label" for="sf-2">Search</label>
      <div class="fm-sf">
        <svg class="fm-sf-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input class="input" id="sf-2" type="search" value="HD Radio stations">
        <button type="button" class="fm-sf-clear" aria-label="Clear search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
  </div>
  <div class="c">
    <span class="fm-st">Focus</span>
    <div class="field">
      <label class="label" for="sf-3">Search FAQs</label>
      <div class="fm-sf">
        <svg class="fm-sf-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input class="input fm-focus" id="sf-3" type="search" placeholder="How do TAP cards work?">
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var q=document.getElementById('sf-q'),x=document.getElementById('sf-clear');
  function sync(){x.hidden=!q.value;}
  q.addEventListener('input',sync);
  q.addEventListener('keydown',function(e){if(e.key==='Escape'){q.value='';sync();} });
  x.addEventListener('click',function(){q.value='';sync();q.focus();});
  document.getElementById('sf-form').addEventListener('submit',function(e){e.preventDefault();});
})();
</script>
</body></html>
