<!-- @dsCard group="Forms" height=480 subtitle="Tag input with checkbox list" -->
<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--off-white)}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;align-items:start}
.c{display:flex;flex-direction:column;gap:24px}
.s{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (max-width:767px){.g{grid-template-columns:minmax(0,1fr)} }
</style></head><body>
<div class="g">
  <div class="c">
    <div class="s">
      <span class="fm-st">Empty</span>
      <div class="field"><label class="label" for="ms1">Languages your church serves</label>
        <div class="fm-tags"><input class="fm-ti" id="ms1" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" placeholder="Choose languages"><button class="fm-tags-caret" type="button" aria-label="Show all languages" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
      </div>
    </div>
    <div class="s">
      <span class="fm-st">Filled · closed · × removes a chip</span>
      <div class="field"><label class="label" for="ms2">Languages your church serves</label>
        <div class="fm-tags" id="ms2-box">
          <span class="fm-tag">Amharic<button class="fm-tag-x" type="button" aria-label="Remove Amharic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
          <span class="fm-tag">Haitian Creole<button class="fm-tag-x" type="button" aria-label="Remove Haitian Creole"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
          <span class="fm-tag">Spanish<button class="fm-tag-x" type="button" aria-label="Remove Spanish"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
          <input class="fm-ti" id="ms2" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-describedby="ms2-h" placeholder="Add more">
          <button class="fm-tags-caret" type="button" aria-label="Show all languages" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
        <p class="hint" id="ms2-h" aria-live="polite">3 selected · Bibles in 500+ languages on dot.Bible</p>
      </div>
    </div>
  </div>
  <div class="s">
    <span class="fm-st">Open · typing "s"</span>
    <div class="field"><span class="label">Languages your church serves</span>
      <div class="fm-tags fm-focus fm-open">
        <span class="fm-tag">Amharic<button class="fm-tag-x" type="button" aria-label="Remove Amharic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
        <span class="fm-tag">Haitian Creole<button class="fm-tag-x" type="button" aria-label="Remove Haitian Creole"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
        <span class="fm-tag">Spanish<button class="fm-tag-x" type="button" aria-label="Remove Spanish"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
        <span class="fm-ti">s</span>
        <span class="fm-tags-caret" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
      </div>
    </div>
    <div class="fm-menu fm-menu-static" role="listbox" aria-multiselectable="true" aria-label="Languages">
      <div class="fm-menu-head">4 matches</div>
      <button class="fm-o" type="button" role="option" aria-selected="true"><span class="fm-mbox"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>Spanish<span class="fm-dial" lang="es">Español</span></button>
      <button class="fm-o fm-active" type="button" role="option" aria-selected="false"><span class="fm-mbox"></span>Swahili<span class="fm-dial" lang="sw">Kiswahili</span></button>
      <button class="fm-o" type="button" role="option" aria-selected="false"><span class="fm-mbox"></span>Persian (Farsi)<span class="fm-dial" lang="fa">فارسی</span></button>
      <button class="fm-o" type="button" role="option" aria-selected="false"><span class="fm-mbox"></span>Russian<span class="fm-dial" lang="ru">Русский</span></button>
    </div>
  </div>
</div>
<script>
(function(){
  var box=document.getElementById('ms2-box'),input=document.getElementById('ms2'),hint=document.getElementById('ms2-h');
  function count(){var n=box.querySelectorAll('.fm-tag').length;hint.textContent=n?n+' selected · Bibles in 500+ languages on dot.Bible':'Bibles in 500+ languages on dot.Bible';input.placeholder=n?'Add more':'Choose languages';}
  box.addEventListener('click',function(e){var x=e.target.closest('.fm-tag-x');if(x){x.parentNode.remove();count();input.focus();}else if(!e.target.closest('button')){input.focus();} });
  input.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!input.value){var t=box.querySelectorAll('.fm-tag');if(t.length){t[t.length-1].remove();count();} } });
})();
</script>
</body></html>
