<!-- @dsCard group="Forms" height=920 subtitle="React Input + field states matrix" -->
<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--off-white)}
.pv{display:flex;flex-direction:column;gap:20px}
.pv-box{background:var(--white);border:1px solid var(--gray-200);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pv-dk{background:var(--black);border-color:rgba(255,255,255,.16);color:var(--white)}
.pv-h{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-600)}
.pv-dk .pv-h{color:rgba(255,255,255,.6)}
.pv-st{font-size:12px;color:var(--gray-600);font-family:ui-monospace,Menlo,monospace}
.pv-cell{display:flex;flex-direction:column;gap:8px;min-width:0}
.pv-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 20px}
.pv-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
@media (max-width:860px){ .pv-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style></head><body>
<div class="pv">
  <div class="pv-box">
    <span class="pv-h">HTML / CSS · field states</span>
    <div class="pv-grid">
      <div class="pv-cell"><span class="pv-st">Default</span><div class="field"><label class="label" for="s1">Email</label><input class="input" id="s1" type="email" placeholder="you@example.com"></div></div>
      <div class="pv-cell"><span class="pv-st">Hover</span><div class="field"><label class="label" for="s2">Email</label><input class="input cr-is-hover" id="s2" type="email" placeholder="you@example.com"></div></div>
      <div class="pv-cell"><span class="pv-st">Focus</span><div class="field"><label class="label" for="s3">Email</label><input class="input cr-is-focus" id="s3" type="email" value="maria@"></div></div>
      <div class="pv-cell"><span class="pv-st">Filled</span><div class="field"><label class="label" for="s4">Email</label><input class="input" id="s4" type="email" value="maria@gracechurch.org"></div></div>
      <div class="pv-cell"><span class="pv-st">Disabled</span><div class="field"><label class="label cr-label-off" for="s5">Email</label><input class="input" id="s5" type="email" value="maria@gracechurch.org" disabled aria-describedby="s5-h"><p class="hint" id="s5-h">Sign in to change this.</p></div></div>
      <div class="pv-cell"><span class="pv-st">Read-only</span><div class="field"><label class="label" for="s6">Partner ID</label><div class="cr-adorn"><input class="input cr-ro" id="s6" type="text" value="ISM-CP-20461" readonly aria-describedby="s6-h"><span class="cr-adorn-end" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span></div><p class="hint" id="s6-h">Can be copied, not edited.</p></div></div>
      <div class="pv-cell"><span class="pv-st">Error</span><div class="field"><label class="label" for="s7">Email</label><input class="input" id="s7" type="email" value="maria@gracechurch" aria-invalid="true" aria-describedby="s7-e"><p class="err" id="s7-e"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>Enter a full email address.</p></div></div>
      <div class="pv-cell"><span class="pv-st">Success</span><div class="field"><label class="label" for="s8">Email</label><div class="cr-adorn"><input class="input cr-ok" id="s8" type="email" value="maria@gracechurch.org" aria-describedby="s8-ok"><span class="cr-adorn-end cr-ok-ic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span></div><p class="cr-ok-msg" id="s8-ok">Looks good.</p></div></div>
    </div>
  </div>
  <div class="pv-two">
    <div class="pv-box">
      <span class="pv-h">HTML / CSS · large &amp; multiline</span>
      <div class="field"><label class="label cr-label-lg" for="l1">Your full name</label><input class="input input-lg" id="l1" type="text" placeholder="e.g. Maria Santos"></div>
      <div class="field"><label class="label cr-label-lg" for="l2">Gift amount (USD)</label><div class="cr-amount"><span class="cr-amount-sym" aria-hidden="true">$</span><input class="input input-lg" id="l2" type="text" inputmode="decimal" value="50"></div></div>
      <div class="field"><label class="label" for="l3">Message <span class="opt">(optional)</span></label><textarea class="input" id="l3" placeholder="How can we help?"></textarea></div>
    </div>
    <div class="pv-box">
      <span class="pv-h">React · Input</span>
      <div id="r-light" style="display:flex;flex-direction:column;gap:16px"></div>
      <div class="pv-box pv-dk on-dark" style="padding:20px">
        <span class="pv-h">React · dark · inside .on-dark</span>
        <div id="r-dark" style="display:flex;flex-direction:column;gap:16px"></div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var NS = window.ISMUI; if(!NS || !window.React || !window.ReactDOM) return;
  var h = React.createElement;
  ReactDOM.createRoot(document.getElementById('r-light')).render(h(React.Fragment,null,
    h(NS.Input,{label:'Email',placeholder:'you@example.com',type:'email'}),
    h(NS.Input,{label:'Your full name',placeholder:'e.g. Maria Santos'})));
  ReactDOM.createRoot(document.getElementById('r-dark')).render(h(React.Fragment,null,
    h(NS.Input,{label:'Email',placeholder:'you@example.com',type:'email',dark:true})));
})();
</script>
</body></html>
