<!-- @dsCard group="Brand" height=500 subtitle="ISM + dot.Bible, light & dark, patterns" -->
<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--off-white);font-family:var(--font-sans)}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.t{border-radius:var(--radius-lg);height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative}
.lt{background:var(--white);box-shadow:var(--shadow-card-light)}
.dk{background:var(--black)}
.dk img{filter:brightness(0) invert(1)}
.row{display:flex;align-items:center;gap:28px}
.lab{position:absolute;left:14px;top:12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-600)}
.dk .lab,.pt .lab{color:var(--gray-300)}
.pt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.pt .t{height:130px;background:var(--charcoal-900);overflow:hidden}
.pt img{width:96px;height:96px;object-fit:contain;filter:brightness(0) invert(1);opacity:.85}
.pt .dots{background:var(--white);box-shadow:var(--shadow-card-light)}
.pt .dots .lab{color:var(--gray-600)}
.pt .dots img{filter:none;opacity:1;width:160px;height:96px;object-fit:cover}
</style></head><body><div>
<div class="g">
  <div class="t lt"><span class="lab">ISM · light</span><div class="row"><img src="../../assets/logos/Full%20Logo%20Black.svg" height="34" alt="International Scripture Ministries"><img src="../../assets/logos/Logo%20Black.svg" height="40" alt=""></div></div>
  <div class="t dk"><span class="lab">ISM · dark</span><div class="row"><img src="../../assets/logos/Full%20Logo%20Black.svg" height="34" alt="International Scripture Ministries"><img src="../../assets/logos/Logo%20Black.svg" height="40" alt=""></div></div>
  <div class="t lt"><span class="lab">dot.Bible · light</span><div class="row"><img src="../../assets/logos/dot.bible%20Full%20Logo%20Black.svg" height="34" alt="dot.Bible"><img src="../../assets/logos/dot.bible%20Icon%20Black.svg" height="44" alt=""></div></div>
  <div class="t dk"><span class="lab">dot.Bible · dark</span><div class="row"><img src="../../assets/logos/dot.bible%20Full%20Logo%20Black.svg" height="34" alt="dot.Bible"><img src="../../assets/logos/dot.bible%20Icon%20Black.svg" height="44" alt=""></div></div>
</div>
<div class="pt">
  <div class="t"><span class="lab">Circle-symbol 1</span><img src="../../assets/patterns/Circle-symbol-1.svg" alt=""></div>
  <div class="t dots"><span class="lab">Dots 1</span><img src="../../assets/patterns/Dots%201.png" alt=""></div>
  <div class="t dots"><span class="lab">Dots 3</span><img src="../../assets/patterns/Dots%203.png" alt=""></div>
</div>
</div></body></html>
