<!-- @dsCard group="Ministry" height=540 subtitle="Radio station on air / off air" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--off-white)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start}
</style></head><body>
<div class="grid">
  <div class="mn-spec">
    <span class="mn-st">On air</span>
    <article class="card card-flat mn-station">
      <div class="mn-station-img"><img class="photo" src="../../assets/imagery/deck-photo-headphones.jpg" alt="A listener wearing headphones"></div>
      <div class="mn-station-body">
        <div class="mn-station-head">
          <div><p class="mn-station-name">KISM</p><p class="mn-station-freq">98.7 FM · HD2</p></div>
          <span class="mn-live"><i aria-hidden="true"></i>On air</span>
        </div>
        <div class="mn-meta">
          <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Nairobi, Kenya</span>
          <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>Swahili · English</span>
        </div>
        <p class="mn-station-now">Now: <span>The Gospel of John, read aloud</span></p>
        <a class="btn btn-primary" href="#" style="width:fit-content"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>Listen live</a>
      </div>
    </article>
  </div>
  <div class="mn-spec">
    <span class="mn-st">Off air</span>
    <article class="card card-flat mn-station">
      <div class="mn-station-img mn-is-off"><img class="photo" src="../../assets/imagery/deck-photo-earbuds.jpg" alt="Earbuds on a table"></div>
      <div class="mn-station-body">
        <div class="mn-station-head">
          <div><p class="mn-station-name">Radio Vida</p><p class="mn-station-freq">104.1 FM</p></div>
          <span class="mn-offair"><i aria-hidden="true"></i>Off air</span>
        </div>
        <div class="mn-meta">
          <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Guatemala City, Guatemala</span>
          <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>Spanish · K’iche’</span>
        </div>
        <p class="mn-station-now">Back on air at <span>6:00 am local time</span></p>
        <a class="btn btn-secondary" href="#" style="width:fit-content">Past broadcasts <span class="arrow" aria-hidden="true">↗</span></a>
      </div>
    </article>
  </div>
</div>
</body></html>
