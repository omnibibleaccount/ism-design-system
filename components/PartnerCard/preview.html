<!-- @dsCard group="Ministry" height=326 subtitle="Initials tile, type badges, ↗" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--off-white)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;align-items:start}
.nm{display:flex;flex-direction:column;gap:4px}
</style></head><body>
<div class="grid">
  <div class="mn-spec">
    <span class="mn-st">Default</span>
    <a class="card card-flat mn-partner" href="#">
      <div class="mn-partner-head"><span class="mn-initials" aria-hidden="true">GC</span><span class="mn-go" aria-hidden="true">↗</span></div>
      <div class="nm">
        <p class="mn-partner-name">Grace Community Church</p>
        <p class="mn-meta mn-meta-sm"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Lagos, Nigeria</span></p>
      </div>
      <div class="mn-partner-badges"><span class="badge badge-partner">Church partner</span></div>
    </a>
  </div>
  <div class="mn-spec">
    <span class="mn-st">Hover · ↗ fills black</span>
    <a class="card card-flat mn-partner mn-is-hover" href="#">
      <div class="mn-partner-head"><span class="mn-initials mn-initials-blue" aria-hidden="true">HT</span><span class="mn-go" aria-hidden="true">↗</span></div>
      <div class="nm">
        <p class="mn-partner-name">Hope Translation Society</p>
        <p class="mn-meta mn-meta-sm"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Chiang Mai, Thailand</span></p>
      </div>
      <div class="mn-partner-badges"><span class="badge badge-partner">Translation partner</span><span class="badge badge-partner">Radio partner</span></div>
    </a>
  </div>
  <div class="mn-spec">
    <span class="mn-st">Focus</span>
    <a class="card card-flat mn-partner mn-focus" href="#">
      <div class="mn-partner-head"><span class="mn-initials mn-initials-violet" aria-hidden="true">RV</span><span class="mn-go" aria-hidden="true">↗</span></div>
      <div class="nm">
        <p class="mn-partner-name">Radio Vida Network</p>
        <p class="mn-meta mn-meta-sm"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Guatemala City, Guatemala</span></p>
      </div>
      <div class="mn-partner-badges"><span class="badge badge-partner">Radio partner</span></div>
    </a>
  </div>
</div>
</body></html>
