<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="ism.css">
<style>
  .page-shell { display: flex; flex-direction: column; gap: var(--space-4); position: relative; max-width: var(--container-max); overflow: hidden; }
  .reader-slot { width: 100%; height: auto; z-index: var(--z-raised); }
  .page-shell > .sx-reader { position: relative; inset: 0; }
  .my-callout { border: 1px solid var(--gray-200); background: var(--off-white); padding: var(--space-4); }
</style></head>
<body>
  <main class="wrap" style="padding-block: var(--space-6)">
    <div class="page-shell">
      <div class="reader-slot"><div class="sx-reader"><p>In the beginning</p></div></div>
      <div class="my-callout"><p>Audio coming soon</p></div>
    </div>
  </main>
</body>
</html>
