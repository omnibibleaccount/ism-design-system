name: Publish hosted design system
# Publishes site/ to GitHub Pages so ChatGPT, Perplexity, Replit, Figma and others can fetch
# every token, rule, spec, stylesheet, font, image and screenshot at a stable URL (no Git LFS).
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run check
      - name: Build site
        run: npm run build:site
        env: { SITE_BASE: "${{ steps.pages.outputs.base_url }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
