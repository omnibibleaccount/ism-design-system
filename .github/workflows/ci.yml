name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  web-and-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - run: npm run check        # generated files up to date, contrast pairs, CSS variables, spec coverage
      - run: npm run build
      - run: npm test
      - name: Next.js example builds
        run: npm run build --workspace @ism/example-next-app
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - name: Build and test Swift package
        working-directory: packages/ios
        run: xcodebuild test -scheme ISMDesignSystem -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Compose module
        working-directory: packages/android
        run: gradle :ism-design-system:testDebugUnitTest :ism-design-system:assembleDebug
